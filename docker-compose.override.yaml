services:
  # mount mock-data/meca, copy .meca and .zip to s3mock biorxiv bucket
  loadbucket:
    image: amazon/aws-cli:2.31.20
    depends_on:
      s3mock:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://s3mock:9090 s3 cp --recursive /mock-meca s3://biorxiv/ --exclude '*' --include '*.meca' --include '*.zip';
      exit 0;
      "
    environment:
      AWS_ACCESS_KEY_ID: s3mock
      AWS_SECRET_ACCESS_KEY: s3mock
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./mock-data/meca:/mock-meca

  # start worker after loaded bucket
  worker:
    depends_on:
      loadbucket:
        condition: service_completed_successfully

  # mock datahub docmaps api
  mock-datahub:
    image: nginx:latest
    ports:
      - 3002:80
    volumes:
      - ./.docker/nginx-datahub-mock.conf:/etc/nginx/conf.d/default.conf
      - ./mock-data/docmaps:/www/test-data/
